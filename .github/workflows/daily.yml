# GitHub：每個交易日抓資料 → 存回 repo → 部署到 GitHub Pages
# 設定：Settings → Pages → Source 選「GitHub Actions」
#       Settings → Actions → General → Workflow permissions 選「Read and write」
#       （選用）Settings → Secrets and variables → Actions
#           Secrets：GEMINI_API_KEY / ANTHROPIC_API_KEY
#           Variables：MOVERS_ARGS，例如  --llm gemini --llm-delay 6 --llm-top 10
name: daily-movers
on:
  schedule:
    - cron: "30 22 * * 1-5"      # UTC 22:30 = 美東收盤後，台灣早上 6:30
    - cron: "15 1 * * 2-6"       # 備援：台灣早上 9:15 再跑一次（GitHub 排程偶爾延遲或漏跑；已抓過的會沿用，不會重複）
  push:                          # 你貼上 AI 整理的事件後，自動重建網站（不重抓股價）
    paths:
      - data/events_manual.csv
      - data/themes_manual.csv
  workflow_dispatch:
    inputs:
      args:
        description: "這次額外參數，例如回溯：--start 2026-01-01 --no-news"
        required: false
        default: ""
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: movers
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 抓取資料並產生網站
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOVERS_ARGS: ${{ vars.MOVERS_ARGS }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}   # 選用：填「名稱 你的email」，SEC 要求提供聯絡方式
          EXTRA_ARGS: ${{ github.event.inputs.args }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python us_movers.py --rebuild
          else
            python us_movers.py $MOVERS_ARGS $EXTRA_ARGS
          fi
      - name: 把歷史資料存回 repo
        run: |
          git config user.name "movers-bot"
          git config user.email "movers-bot@users.noreply.github.com"
          git add -A data
          git commit -m "movers $(date -u +%F)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            git push && exit 0
            echo "遠端在這段期間有新提交（例如另一次執行或你在網頁上改了檔案），合併後重試 $i/3"
            rm -rf /tmp/ours && mkdir -p /tmp/ours
            cp data/movers_history.csv data/last_run.json /tmp/ours/
            cp data/profiles.csv /tmp/ours/ 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python us_movers.py --merge-from /tmp/ours
            git add -A data
            git commit -m "movers $(date -u +%F) (merged)" || true
          done
          exit 1
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
